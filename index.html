<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>HandyBand — Gesture Music</title>
    <style>
      :root {
        --ink: #e9eff2;
        --muted: #91a1ac;
        --black: #080b12;
        --panel: #0d141b;
        --panel-light: #16222b;
        --cyan: #62e8ee;
        --pink: #ec58be;
        --line: rgba(210, 238, 240, .65);
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 22% 32%, rgba(24, 127, 146, .18), transparent 31rem),
          radial-gradient(circle at 78% 54%, rgba(165, 42, 128, .16), transparent 34rem),
          var(--black);
        font-family: "Courier New", Courier, monospace;
      }

      body::before {
        position: fixed;
        z-index: -1;
        inset: 0;
        pointer-events: none;
        content: "";
        opacity: .23;
        background-image: linear-gradient(rgba(255,255,255,.065) 1px, transparent 1px);
        background-size: 100% 4px;
      }

      button, select { font: inherit; }
      button { cursor: pointer; }

      .stage {
        width: min(100%, 1540px);
        min-height: 100vh;
        margin: 0 auto;
        padding: clamp(24px, 4vw, 62px);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid rgba(233, 239, 242, .7);
        font-size: clamp(.68rem, 1.15vw, .82rem);
        font-weight: 700;
        letter-spacing: .075em;
        text-transform: uppercase;
      }

      .brand { margin-right: auto; color: var(--ink); }
      .brand b, .signal { color: var(--cyan); }
      .topbar-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
      .top-status { color: var(--muted); text-align: right; }
      .top-sound-control {
        padding: 8px 10px;
        border: 1px solid var(--line);
        color: var(--cyan);
        background: rgba(8, 13, 18, .78);
        font-size: .65rem;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
      .top-sound-control:hover, .top-sound-control:focus-visible { border-color: var(--pink); outline: none; box-shadow: 0 0 13px rgba(236, 88, 190, .32); }
      .fullscreen-control {
        padding: 8px 10px;
        border: 1px solid var(--line);
        color: var(--cyan);
        background: rgba(8, 13, 18, .78);
        font-size: .65rem;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
      .fullscreen-control:hover, .fullscreen-control:focus-visible { border-color: var(--pink); outline: none; box-shadow: 0 0 13px rgba(236, 88, 190, .32); }

      .workbench {
        display: grid;
        grid-template-columns: minmax(145px, .55fr) minmax(560px, 3.25fr) minmax(155px, .55fr);
        align-items: center;
        gap: clamp(24px, 4vw, 72px);
        min-height: calc(100vh - 140px);
        padding: clamp(42px, 7vh, 90px) 0 24px;
      }

      .info-panel {
        position: relative;
        padding: 18px;
        border: 1px solid var(--line);
        background: rgba(8, 13, 18, .78);
        box-shadow: 5px 5px 0 rgba(236, 88, 190, .48), -3px -3px 0 rgba(98, 232, 238, .26);
      }

      .info-panel::before {
        position: absolute;
        top: 8px;
        left: 8px;
        color: var(--pink);
        content: "//";
        font-size: .66rem;
      }

      .kicker, .label {
        margin: 0 0 13px;
        color: var(--cyan);
        font-size: .66rem;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      h1, h2, p { margin-top: 0; }
      h1 { margin-bottom: 10px; font-size: clamp(1.1rem, 2vw, 1.55rem); letter-spacing: .04em; }
      h2 { margin-bottom: 14px; font-size: .82rem; line-height: 1.5; letter-spacing: .04em; text-transform: uppercase; }
      .info-panel p:not(.kicker):not(.label) { margin-bottom: 0; color: #c1cbd0; font-size: .75rem; line-height: 1.72; }
      .live-state { margin-top: 16px !important; color: var(--cyan) !important; font-weight: 700; }

      .monitor-stack { width: 100%; min-width: 0; }
      .monitor {
        position: relative;
        padding: clamp(18px, 2.4vw, 32px) clamp(18px, 2.4vw, 30px) clamp(32px, 4vw, 52px);
        border: 2px solid #9caeb5;
        border-radius: 19px 19px 28px 28px;
        background: linear-gradient(145deg, #4d6067 0%, #18242b 10%, #111a20 83%, #3a4a50 100%);
        box-shadow: 0 0 0 3px #071016, 0 0 0 5px rgba(98, 232, 238, .64), 0 0 28px rgba(98, 232, 238, .42), 0 0 42px rgba(236, 88, 190, .24), inset 0 0 17px rgba(255,255,255,.15);
      }

      .monitor::after {
        content: none;
      }

      .screen {
        position: relative;
        overflow: hidden;
        aspect-ratio: 16 / 10;
        border: 8px solid #071015;
        border-radius: 9% / 7%;
        background: #03070b;
        box-shadow: inset 0 0 0 2px #35464b, inset 0 0 35px #000;
        cursor: pointer;
      }

      .screen:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }

      #camera, #landmark-overlay {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #camera { background: #03070b; transform: scaleX(-1); }
      #landmark-overlay { pointer-events: none; transform: scaleX(-1); }

      .screen::after {
        position: absolute;
        z-index: 2;
        inset: 0;
        pointer-events: none;
        opacity: .19;
        background: repeating-linear-gradient(to bottom, rgba(255,255,255,.17) 0 1px, transparent 1px 4px);
        content: "";
      }

      .camera-placeholder {
        position: absolute;
        z-index: 3;
        top: 50%;
        left: 50%;
        width: min(78%, 320px);
        color: #bfd3d6;
        text-align: center;
        font-size: .75rem;
        line-height: 1.6;
        transform: translate(-50%, -50%);
      }

      .camera-placeholder strong { display: block; margin-bottom: 6px; color: var(--cyan); letter-spacing: .08em; }
      .hidden { display: none; }

      .camera-status {
        position: absolute;
        z-index: 4;
        right: 14px;
        bottom: 12px;
        max-width: calc(100% - 28px);
        margin: 0;
        padding: 5px 7px;
        color: var(--cyan);
        background: rgba(1, 4, 7, .8);
        font-size: .61rem;
        line-height: 1.25;
        letter-spacing: .05em;
        text-transform: uppercase;
      }

      .pause-overlay {
        position: absolute;
        z-index: 5;
        top: 50%;
        left: 50%;
        min-width: min(76%, 230px);
        padding: 14px 18px;
        border: 1px solid var(--cyan);
        color: var(--ink);
        background: rgba(3, 7, 11, .88);
        box-shadow: 0 0 24px rgba(98, 232, 238, .32);
        font-size: .72rem;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        transform: translate(-50%, -50%);
      }

      .pause-overlay:hover, .pause-overlay:focus-visible { border-color: var(--pink); outline: none; }

      .channel-bank {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(7px, 1.2vw, 13px);
        min-height: 34px;
        margin-top: clamp(12px, 1.6vw, 18px);
      }

      .channel-button {
        width: clamp(31px, 3.1vw, 42px);
        height: clamp(23px, 2.4vw, 30px);
        border: 1px solid #65777d;
        border-radius: 4px;
        color: #b9c9cd;
        background: linear-gradient(145deg, #34454a, #10191e);
        box-shadow: inset 0 1px 1px rgba(255,255,255,.16), 0 2px 0 #05090c;
        font-family: inherit;
        font-size: .58rem;
        font-weight: 700;
        letter-spacing: .04em;
      }

      .channel-button:hover, .channel-button:focus-visible, .channel-button[aria-pressed="true"] {
        border-color: var(--cyan);
        color: var(--cyan);
        outline: none;
        box-shadow: 0 0 10px rgba(98, 232, 238, .46), inset 0 1px 1px rgba(255,255,255,.16);
      }

      .channel-button[aria-pressed="true"] { transform: translateY(1px); background: #07161c; }
      .channel-button:disabled { cursor: default; opacity: .38; }

      .gesture-prompt {
        margin: 0 !important;
        color: var(--cyan) !important;
        font-size: .9rem !important;
        font-weight: 700;
        letter-spacing: .05em;
        line-height: 1.7 !important;
        text-align: center;
      }

      .monitor-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 18px 13px 0;
        color: #b9c9cd;
        font-size: .62rem;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .power { display: inline-flex; align-items: center; gap: 6px; }
      .power::before { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 9px var(--cyan); content: ""; }

      .control-list { display: grid; gap: 8px; }
      .control, select {
        width: 100%;
        min-height: 38px;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 0;
        color: var(--ink);
        background: rgba(4, 8, 12, .86);
        font-size: .7rem;
        font-weight: 700;
        letter-spacing: .05em;
        text-align: left;
        text-transform: uppercase;
      }

      .control:hover, .control:focus-visible, select:focus-visible { border-color: var(--cyan); outline: none; box-shadow: 0 0 12px rgba(98, 232, 238, .28); }
      .sound-control { color: var(--cyan); }
      .control small { color: var(--pink); }
      .meta { margin-top: 17px !important; color: var(--muted) !important; font-size: .64rem !important; }

      :fullscreen { background: var(--black); }
      :fullscreen .stage { width: min(100%, 1800px); }

      @media (max-width: 900px) {
        .workbench { grid-template-columns: 1fr; gap: 25px; padding-top: 44px; }
        .monitor-stack { order: -1; width: min(100%, 720px); margin: 0 auto; }
        .info-panel { width: min(100%, 720px); margin: 0 auto; }
      }

      @media (max-width: 520px) {
        .stage { padding: 22px 16px; }
        .topbar { align-items: flex-start; flex-direction: column; }
        .topbar-actions { align-items: flex-start; flex-direction: column; }
        .top-status { text-align: left; }
        .monitor { padding: 14px 14px 38px; border-radius: 13px 13px 20px 20px; }
        .screen { border-width: 6px; }
      }
    </style>
  </head>
  <body>
    <main id="stage" class="stage" aria-label="HandyBand gesture music workspace">
      <header class="topbar">
        <button id="camera-button" class="top-sound-control" type="button">◖ SOUND OFF</button>
        <div class="topbar-actions">
          <div id="model-status" class="hidden" aria-live="polite"></div>
          <button id="fullscreen-button" class="fullscreen-control" type="button">⌜ FULLSCREEN</button>
        </div>
      </header>

      <section class="workbench">
        <aside class="info-panel" aria-labelledby="gesture-heading">
          <p class="kicker">01 / INPUT</p>
          <h1 id="gesture-heading">PLAY WITH YOUR HANDS</h1>
          <p id="gesture-state" class="hidden" aria-live="polite"></p>
        </aside>

        <section class="monitor-stack" aria-label="Live camera and hand tracking">
          <div class="monitor">
            <div id="camera-screen" class="screen" tabindex="0" aria-label="Camera tracking display. Tap to pause or resume tracking.">
              <video id="camera" autoplay muted playsinline></video>
              <canvas id="landmark-overlay" aria-hidden="true"></canvas>
              <div id="camera-placeholder" class="camera-placeholder"><strong>CAMERA STANDBY</strong>Allow camera access to begin gesture tracking.</div>
              <p id="camera-status" class="camera-status">STARTING CAMERA…</p>
              <button id="pause-overlay" class="pause-overlay hidden" type="button">PAUSED — TAP TO RESUME</button>
            </div>
            <div class="channel-bank" aria-label="Television channel controls">
              <button class="channel-button" type="button" data-channel="Odysseus" aria-pressed="true" aria-label="Odysseus"></button>
              <button class="channel-button" type="button" data-channel="Piano" aria-pressed="false" aria-label="Piano"></button>
              <button class="channel-button" type="button" disabled aria-label="Unavailable"></button>
              <button class="channel-button" type="button" disabled aria-label="Unavailable"></button>
            </div>
          </div>
          <div class="monitor-foot"><span class="power">LIVE INPUT</span><span id="channel-readout">ODYSSEUS</span></div>
        </section>

        <aside class="info-panel" aria-label="Gesture instructions">
          <p class="gesture-prompt">Try showing 1, 2, 3, 4…</p>
          <select id="style" class="hidden" aria-label="Music style"><option>Odysseus</option><option>Piano</option></select>
          <span id="style-note" class="hidden"></span>
        </aside>
      </section>
    </main>
    <script type="module" src="./web/handyband.js"></script>
  </body>
</html>
