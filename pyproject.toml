[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "handyband"
version = "1.0.1"
description = "Camera-based hand and finger tracking for gesture-controlled music"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HandyBand contributors" }]
dependencies = [
    "mediapipe>=1.0.1,<2",
    "numpy>=2,<3",
    "opencv-contrib-python>=4.10,<5",
    "pygame>=2.6,<3",
    "mido>=1.3,<2",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
handyband = "handyband.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
