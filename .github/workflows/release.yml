name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - run: uv sync --locked --extra dev --extra build
      - run: uv run --locked pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked python scripts/build_windows.py
      - name: Package
        shell: pwsh
        run: |
          $version = (uv run --locked python -c "import importlib.metadata; print(importlib.metadata.version('handyband'))").Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          $archive = "HandyBand-v$version-windows-x64.zip"
          Compress-Archive -Path dist/HandyBand -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: HandyBand-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "HandyBand $env:GITHUB_REF_NAME" --notes-file docs/releases/v1.0.1.md
